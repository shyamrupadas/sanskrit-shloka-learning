<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prototype — советы внутри заучивания</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --bg: #f8fafc;
        --surface: #ffffff;
        --text: #334155;
        --muted: #64748b;
        --line: #d6dee9;
        --primary: #2563eb;
        --primary-soft: #eff6ff;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #e8edf4; color: var(--text); }
      button, select { font: inherit; }
      button { cursor: pointer; }
      button:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
      button:disabled { cursor: default; opacity: 0.55; }
      h1, h2, p { margin: 0; }

      .prototype-shell {
        width: min(100%, 390px);
        min-height: 844px;
        margin: 20px auto 128px;
        background: var(--bg);
        box-shadow: 0 22px 70px rgb(15 23 42 / 0.18);
        position: relative;
        overflow: hidden;
      }

      .screen { min-height: 844px; display: flex; flex-direction: column; padding: 20px 16px 24px; }
      .topbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 42px; gap: 8px; }
      .topbar-title { font-size: 14px; font-weight: 750; text-align: center; }
      .text-action { min-height: 40px; border: 0; background: transparent; color: var(--primary); padding: 0 4px; font-weight: 700; }
      .tip-trigger { justify-self: end; min-width: 68px; }
      .copy { display: grid; gap: 10px; margin-top: 28px; }
      .eyebrow { color: var(--primary); font-size: 12px; font-weight: 850; letter-spacing: 0.08em; text-transform: uppercase; }
      h1 { font-family: "Noto Serif", Georgia, serif; font-size: 24px; line-height: 1.25; }
      .instruction { color: var(--muted); font-size: 15px; line-height: 1.5; }
      .verse { margin-top: 34px; white-space: pre-line; font-family: "Noto Serif", Georgia, serif; font-size: 21px; line-height: 1.58; font-weight: 700; }
      .utilities { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 24px; }
      .completion { margin-top: auto; padding-top: 28px; }
      .primary, .secondary { min-height: 48px; width: 100%; border-radius: 10px; padding: 0 16px; font-weight: 760; }
      .primary { border: 1px solid var(--primary); background: var(--primary); color: #fff; }
      .secondary { border: 1px solid var(--line); background: #fff; color: var(--primary); }
      .button-note { margin-top: 8px; color: var(--muted); font-size: 13px; line-height: 1.4; text-align: center; }

      .sheet-backdrop { position: absolute; inset: 0; z-index: 10; display: flex; align-items: flex-end; background: rgb(15 23 42 / 0.48); }
      .sheet { width: 100%; max-height: 72%; overflow: auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 10px 18px 26px; box-shadow: 0 -20px 50px rgb(15 23 42 / 0.2); }
      .sheet-handle { width: 42px; height: 4px; margin: 0 auto 10px; border-radius: 999px; background: #cbd5e1; }
      .sheet-header { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
      .sheet h2 { font-size: 21px; line-height: 1.25; }
      .close { width: 44px; height: 44px; border: 0; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-size: 22px; line-height: 1; }
      .tip-copy { color: var(--text); font-size: 16px; line-height: 1.55; }
      .sheet-note { color: var(--muted); font-size: 13px; line-height: 1.45; }
      .link-action { min-height: 44px; border: 0; background: transparent; color: var(--primary); padding: 0 4px; font-weight: 720; text-decoration: underline; text-underline-offset: 3px; }
      .exhausted { border-radius: 10px; background: #f1f5f9; color: var(--muted); padding: 11px 12px; font-size: 13px; line-height: 1.4; }

      .variant-a { display: grid; gap: 18px; }
      .variant-a .tip-copy { margin-top: 4px; font-size: 18px; }
      .variant-a .sheet-actions { display: grid; gap: 8px; }

      .variant-b { display: grid; gap: 16px; }
      .counter { color: var(--primary); font-size: 13px; font-weight: 820; }
      .tip-card { border: 1px solid #bfdbfe; border-radius: 14px; background: var(--primary-soft); padding: 18px; }
      .tip-card .tip-copy { margin-top: 8px; }
      .variant-b .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .variant-b .all-tips { grid-column: 1 / -1; }

      .variant-c { display: grid; gap: 14px; }
      .variant-c .sheet-header { grid-template-columns: auto 1fr auto; }
      .variant-c .sheet-header .eyebrow { text-align: center; }
      .variant-c .tip-copy { padding: 8px 0 4px; font-family: "Noto Serif", Georgia, serif; font-size: 19px; line-height: 1.5; }
      .compact-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
      .compact-actions button { min-height: 44px; border: 0; border-radius: 8px; background: transparent; color: var(--primary); font-size: 13px; font-weight: 740; }
      .compact-actions button:first-child { background: var(--primary-soft); }

      .page-outcome { position: absolute; inset: 0; z-index: 12; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 28px; background: var(--bg); }
      .page-outcome h2 { font-size: 23px; }
      .page-outcome p { color: var(--muted); line-height: 1.5; }

      .prototype-controls { position: fixed; left: 50%; bottom: 14px; z-index: 99; transform: translateX(-50%); width: min(calc(100% - 20px), 720px); border-radius: 16px; background: #0f172a; color: #fff; box-shadow: 0 14px 50px rgb(15 23 42 / 0.45); padding: 10px; }
      .control-row { display: grid; grid-template-columns: 42px minmax(160px, 1fr) 42px minmax(170px, 0.8fr); gap: 8px; align-items: center; }
      .prototype-controls button, .prototype-controls select { height: 38px; border: 1px solid #475569; border-radius: 9px; background: #1e293b; color: #fff; }
      .variant-label { text-align: center; font-weight: 760; font-size: 14px; }
      .state-output { margin-top: 8px; color: #cbd5e1; font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }

      @media (max-width: 560px) {
        .prototype-shell { margin: 0; box-shadow: none; }
        .prototype-controls { position: relative; left: auto; bottom: auto; transform: none; width: calc(100% - 20px); margin: 12px auto; }
        .control-row { grid-template-columns: 42px 1fr 42px; }
        .control-row select { grid-column: 1 / -1; }
      }
    </style>
  </head>
  <body>
    <main class="prototype-shell" id="app"></main>

    <aside class="prototype-controls" aria-label="Управление прототипом">
      <div class="control-row">
        <button id="previous" aria-label="Предыдущий вариант">←</button>
        <div class="variant-label" id="variant-label"></div>
        <button id="next" aria-label="Следующий вариант">→</button>
        <select id="state-select" aria-label="Состояние серии советов">
          <option value="first">Первый совет</option>
          <option value="middle">Несколько уже показано</option>
          <option value="exhausted">Все советы показаны</option>
          <option value="closed">Лист закрыт</option>
        </select>
      </div>
      <div class="state-output" id="state-output"></div>
    </aside>

    <script>
      const variants = {
        A: { name: "Один совет", render: renderVariantA },
        B: { name: "Колода", render: renderVariantB },
        C: { name: "Компактный лист", render: renderVariantC },
      };
      const tips = [
        "Читайте каждую строку как отдельную смысловую фразу. Сначала произнесите ее медленно, затем соедините со следующей строкой и повторите весь фрагмент без паузы.",
        "Разберите ключевые слова и свяжите их с общим смыслом строки. Вспоминайте не только звучание, но и последовательность образов или действий, которую передает текст.",
        "Не пытайтесь угадать весь текст сразу. Вспомните первое слово или смысл строки, прочитайте подсказку и затем повторите шлоку целиком еще раз.",
      ];
      const variantKeys = Object.keys(variants);
      const params = new URLSearchParams(location.search);
      let state = initialState(variants[params.get("variant")] ? params.get("variant") : "A", "first");
      let tipTrigger = null;

      function initialState(variant, preset) {
        if (preset === "middle") return { variant, open: true, order: [0, 1, 2], position: 1, seen: [0, 1], destination: null, lastAction: "preset-middle" };
        if (preset === "exhausted") return { variant, open: true, order: [0, 1, 2], position: 2, seen: [0, 1, 2], destination: null, lastAction: "preset-exhausted" };
        if (preset === "closed") return { variant, open: false, order: [0, 1, 2], position: 0, seen: [0], destination: null, lastAction: "preset-closed" };
        return { variant, open: true, order: [0, 1, 2], position: 0, seen: [0], destination: null, lastAction: "prototype-opened" };
      }

      function baseScreen() {
        return `<section class="screen" ${state.open || state.destination ? "inert aria-hidden=\"true\"" : ""}>
          <header class="topbar">
            <button class="text-action" data-action="cancel">Отмена</button>
            <div class="topbar-title">Заучивание</div>
            <button class="text-action tip-trigger" data-action="open-tip">Совет</button>
          </header>
          <div class="copy"><span class="eyebrow">Быстрая попытка</span><h1>Бхагавад-гита 1.1</h1><p class="instruction">Учите в своём темпе. Когда решите, что готовы перейти к повторению, нажмите «Выучил».</p></div>
          <div class="verse">дхарма-кшетре куру-кшетре<br>самавета юютсавах<br>мамаках пандавашчаива<br>кимакурвата санджая</div>
          <div class="utilities"><button class="secondary">Помощник</button><button class="secondary" data-action="open-tip">Совет</button></div>
          <div class="completion"><button class="primary">Выучил</button><p class="button-note">Переведёт шлоку в повторение без дополнительного подтверждения</p></div>
        </section>`;
      }

      function currentTip() { return tips[state.order[state.position]]; }
      function hasNextTip() { return state.position < state.order.length - 1; }
      function exhaustedMessage() { return hasNextTip() ? "" : `<p class="exhausted" role="status">Все советы этой сессии уже показаны. Можно вернуться к шлоке или открыть полный список.</p>`; }
      function closeButton() { return `<button class="close" data-action="close-tip" aria-label="Закрыть совет">×</button>`; }
      function sheet(content, variantClass, titleId) {
        return `<div class="sheet-backdrop"><section class="sheet ${variantClass}" role="dialog" aria-modal="true" aria-labelledby="${titleId}"><div class="sheet-handle"></div>${content}</section></div>`;
      }

      function renderVariantA() {
        return sheet(`<div class="sheet-header"><h2 id="tip-title-a">Совет</h2>${closeButton()}</div>
          <p class="tip-copy">${currentTip()}</p>${exhaustedMessage()}
          <div class="sheet-actions"><button class="primary" data-action="next-tip" ${hasNextTip() ? "" : "disabled"}>${hasNextTip() ? "Другой совет" : "Других советов нет"}</button><button class="link-action" data-action="all-tips">Все советы</button></div>`, "variant-a", "tip-title-a");
      }

      function renderVariantB() {
        return sheet(`<div class="sheet-header"><div><div class="counter">Совет ${state.position + 1} из ${state.order.length}</div><h2 id="tip-title-b">Попробуйте так</h2></div>${closeButton()}</div>
          <div class="tip-card"><span class="eyebrow">Практика на минуту</span><p class="tip-copy">${currentTip()}</p></div>${exhaustedMessage()}
          <div class="sheet-actions"><button class="secondary" data-action="close-tip">К шлоке</button><button class="primary" data-action="next-tip" ${hasNextTip() ? "" : "disabled"}>${hasNextTip() ? "Следующий" : "Советы закончились"}</button><button class="link-action all-tips" data-action="all-tips">Открыть все советы</button></div>`, "variant-b", "tip-title-b");
      }

      function renderVariantC() {
        return sheet(`<div class="sheet-header">${closeButton()}<span class="eyebrow" id="tip-title-c">Совет для попытки</span><span class="counter">${state.position + 1}/${state.order.length}</span></div>
          <p class="tip-copy">${currentTip()}</p>${exhaustedMessage()}
          <div class="compact-actions"><button data-action="next-tip" ${hasNextTip() ? "" : "disabled"}>Другой</button><button data-action="all-tips">Все советы</button><button data-action="close-tip">Закрыть</button></div>`, "variant-c", "tip-title-c");
      }

      function renderOutcome() {
        if (state.destination !== "all-tips") return "";
        return `<section class="page-outcome" role="status"><span class="eyebrow">Модель перехода</span><h2>Страница «Советы»</h2><p>Полный список открывается отдельным явным действием. Редизайн существующей страницы не входит в эту карту; browser back должен вернуть пользователя к незавершённой попытке.</p><button class="secondary" data-action="return-from-all">Вернуться назад в прототип</button></section>`;
      }

      function render() {
        document.querySelector("#app").innerHTML = baseScreen() + (state.open ? variants[state.variant].render() : "") + renderOutcome();
        document.querySelector("#variant-label").textContent = `${state.variant} (${variants[state.variant].name})`;
        document.querySelector("#state-output").textContent = `state ${JSON.stringify(state)}`;
        bindActions();
        if (state.open) requestAnimationFrame(() => document.querySelector(".sheet button:not(:disabled)")?.focus());
      }

      function setVariant(variant) {
        state = { ...state, variant, destination: null, lastAction: "variant-changed" };
        const url = new URL(location.href);
        url.searchParams.set("variant", variant);
        history.replaceState(null, "", url);
        render();
      }

      function cycleVariant(direction) {
        const index = variantKeys.indexOf(state.variant);
        setVariant(variantKeys[(index + direction + variantKeys.length) % variantKeys.length]);
      }

      function bindActions() {
        document.querySelectorAll("[data-action]").forEach((element) => element.addEventListener("click", () => act(element.dataset.action, element)));
      }

      function act(action, element) {
        if (action === "open-tip") {
          tipTrigger = element;
          state = { ...state, open: true, lastAction: "tip-opened" };
        }
        if (action === "close-tip") {
          state = { ...state, open: false, lastAction: "returned-to-attempt" };
          render();
          requestAnimationFrame(() => (tipTrigger || document.querySelector(".tip-trigger"))?.focus());
          return;
        }
        if (action === "next-tip" && hasNextTip()) {
          const nextPosition = state.position + 1;
          state = { ...state, position: nextPosition, seen: [...state.seen, state.order[nextPosition]], lastAction: "next-nonrepeating-tip" };
        }
        if (action === "all-tips") state = { ...state, open: false, destination: "all-tips", lastAction: "all-tips-opened" };
        if (action === "return-from-all") state = { ...state, open: true, destination: null, lastAction: "browser-back-to-attempt" };
        if (action === "cancel") state = { ...state, lastAction: "cancel-outside-ticket" };
        render();
      }

      document.querySelector("#previous").addEventListener("click", () => cycleVariant(-1));
      document.querySelector("#next").addEventListener("click", () => cycleVariant(1));
      document.querySelector("#state-select").addEventListener("change", (event) => {
        state = initialState(state.variant, event.target.value);
        render();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && state.open) { act("close-tip"); return; }
        if (event.target.matches("input, textarea, select, [contenteditable]")) return;
        if (event.key === "ArrowLeft") cycleVariant(-1);
        if (event.key === "ArrowRight") cycleVariant(1);
      });

      render();
    </script>
  </body>
</html>
