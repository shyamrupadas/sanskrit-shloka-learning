<!-- THROWAWAY: three structural variants of the admin flow, ?variant=A|B|C.

<style>
:root{--bg:#f8fafc;--surface:#fff;--muted:#f1f5f9;--text:#334155;--secondary:#64748b;--border:#e2e8f0;--primary:#2563eb;--danger:#b91c1c;--radius:12px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.4}a{color:var(--primary)}h1,h2,h3,p{margin:0}h1{font-size:20px;line-height:1.3}h2{font-size:18px}h3{font-size:16px}button{color:inherit}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}p,span,h1,h2,h3{overflow-wrap:anywhere}.muted{color:var(--secondary)}.small{font-size:12px}.stack{display:grid;gap:16px}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.btn{white-space:nowrap;min-height:44px;border:1px solid var(--border);background:white;border-radius:10px;padding:10px 16px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}.primary{background:var(--primary);color:white;border-color:var(--primary)}.danger{color:var(--danger)}.danger-fill{background:var(--danger);border-color:var(--danger);color:white}.quiet{border-color:transparent;background:transparent}.icon{width:44px;min-width:44px;padding:8px}.card{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:16px}.page{max-width:768px;margin:auto;padding:24px 24px 130px}.page-header{display:flex;align-items:center;gap:12px;margin-bottom:24px}.page-header h1{flex:1}.eyebrow{font-size:12px;color:var(--secondary);margin-bottom:4px}.section-link{width:100%;text-align:left;display:flex;align-items:center;gap:16px;padding:22px;border:1px solid var(--border);border-radius:12px;background:white}.section-link:hover,.tip-open:hover{border-color:#93c5fd;background:#f8fbff}.section-icon{width:44px;height:44px;flex-shrink:0;background:#eff6ff;color:var(--primary);border-radius:12px;display:grid;place-items:center;font-size:22px}.chevron{font-size:24px;color:var(--secondary)}.home-intro{margin-bottom:24px}.home-grid{display:grid;gap:14px}.notice{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;border-radius:10px;padding:12px 16px;margin-bottom:16px}.error{background:#fef2f2;color:#991b1b;border-color:#fecaca}.empty{padding:48px 20px;text-align:center;display:grid;justify-items:center;gap:12px}.toolbar{display:flex;gap:16px;align-items:center;justify-content:space-between;margin:20px 0 16px}.tip-list{display:grid;gap:12px}.tip-row{display:flex;align-items:center;gap:12px}.tip-open{flex:1;min-width:0;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:8px}.tip-open strong{display:block;font-size:16px}.excerpt{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;color:var(--secondary);margin-top:6px;font-size:13px;white-space:pre-line}.order{display:flex;gap:4px}.ordinal{font-size:12px;color:var(--secondary);min-width:16px}.tip-footer{display:flex;justify-content:space-between;align-items:center;margin-top:4px}.field{display:grid;gap:6px}.field label{font-weight:600}.field input,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:12px;background:white;color:var(--text)}.field input:focus,.field textarea:focus{outline:2px solid #93c5fd;outline-offset:1px}.field textarea{min-height:240px;resize:vertical;line-height:1.6}.field-meta{display:flex;justify-content:space-between;gap:10px;color:var(--secondary);font-size:12px}.form-actions{display:flex;gap:10px;margin-top:8px}.form-actions .primary{flex:1}.editor{display:grid;gap:20px}.form-help{font-size:13px;color:var(--secondary)}.admin-tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:24px;padding-bottom:8px}.admin-tabs .active{background:#eff6ff;color:var(--primary)}.b-layout{max-width:1000px}.b-layout .tip-list{gap:0;background:white;border:1px solid var(--border);border-radius:12px;overflow:hidden}.b-layout .tip-row-wrap{border:0;border-radius:0;border-bottom:1px solid var(--border)}.b-layout .tip-row-wrap:last-child{border-bottom:0}.b-layout .editor{max-width:650px;margin:auto}.workspace{max-width:1250px;margin:auto;padding:24px 24px 130px}.workspace-grid{display:grid;grid-template-columns:180px minmax(0,1fr);gap:28px}.side-nav{display:flex;flex-direction:column;gap:8px}.side-nav .btn{justify-content:flex-start}.side-nav .active{background:#eff6ff;color:var(--primary);border-color:transparent}.split{display:grid;grid-template-columns:minmax(230px,.8fr) minmax(300px,1.2fr);gap:20px;align-items:start}.split .editor-pane{position:sticky;top:20px}.split .tip-row-wrap{padding:8px}.split .tip-row{gap:4px;align-items:flex-start}.split .order{flex-direction:column;gap:0}.split .order .icon{min-height:34px;height:34px;width:34px;min-width:34px;padding:4px}.split .tip-open strong{font-size:14px}.split .excerpt{display:none}.split .tip-row-wrap.selected{border-color:var(--primary);background:#eff6ff}.split .tip-footer{display:none}.placeholder{display:grid;place-content:center;min-height:300px;text-align:center;gap:10px}.catalog-source{font-family:"Noto Serif",Georgia,serif}.catalog-items{padding-left:18px;display:grid;gap:8px}.catalog-item{padding:12px;border:1px solid var(--border);border-radius:10px;background:white}.app-bottom{display:flex;gap:8px;padding:12px;background:white;border:1px solid var(--border);border-radius:12px;margin-top:32px;justify-content:space-around;font-size:12px}.app-bottom b{color:var(--primary)}
.lab{background:#0f172a;color:#e2e8f0;padding:12px 20px;font-size:12px}.lab-inner{max-width:1200px;margin:auto}.lab summary{cursor:pointer;display:flex;gap:12px;justify-content:space-between}.lab-controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding-top:14px}.lab select,.lab button{border:1px solid #475569;border-radius:6px;background:#1e293b;color:white;padding:8px;min-height:36px}.lab pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:190px;overflow:auto}.lab-note{margin-top:10px;color:#cbd5e1}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f172a;color:white;box-shadow:0 8px 30px #0f172a33;border-radius:16px;padding:6px;display:flex;align-items:center;gap:4px;z-index:10;width:min(430px,calc(100% - 24px))}.switcher button{background:transparent;color:white;border:0;border-radius:10px;min-width:44px;min-height:44px;font-size:18px}.switcher button:hover{background:#334155}.switcher-label{flex:1;text-align:center;line-height:1.4;font-size:13px}.switcher-label small{display:block;color:#94a3b8;font-size:11px}.toast{min-height:0}.spinner{width:26px;height:26px;border:3px solid #dbeafe;border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}dialog{max-width:420px;width:calc(100% - 32px);padding:24px;border:1px solid var(--border);border-radius:16px;color:var(--text);box-shadow:0 20px 80px #0f172a33}dialog::backdrop{background:#0f172a66}dialog h2{margin-bottom:12px}dialog .form-actions{margin-top:24px}dialog p{white-space:pre-line}.mobile-back{display:none}
@media(min-width:900px){.home-grid{grid-template-columns:1fr 1fr}.variant-c-home .home-grid{grid-template-columns:1fr}.variant-c-home{max-width:900px}.variant-c-home .section-link{border-radius:0;border-left:0;border-right:0;background:transparent;padding:24px 8px}.variant-c-home .section-icon{display:none}}
@media(max-width:760px){.page,.workspace{padding:20px 16px 130px}.page-header{gap:8px;margin-bottom:20px}.section-link{padding:18px}.toolbar{gap:10px}.toolbar .btn{padding:10px 12px}.tip-row{flex-wrap:nowrap;gap:8px}.tip-row .order{margin-left:auto}.tip-open{flex-basis:auto}.tip-row-wrap{padding:12px}.tip-footer{margin-top:0}.workspace-grid{display:block}.side-nav{flex-direction:row;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border);gap:4px}.side-nav .btn{flex:1;justify-content:center;padding:10px 8px;font-size:13px}.side-nav .side-home{display:none}.split{display:block}.split .editor-pane{position:static}.split.editing .list-pane{display:none}.split:not(.editing) .editor-pane{display:none}.split .tip-row{flex-wrap:nowrap}.split .tip-open{flex-basis:auto}.split .order{flex-direction:row;margin:0}.split .order .icon{width:40px;min-width:40px;height:44px}.mobile-back{display:inline-flex}.admin-tabs{gap:2px}.admin-tabs .btn{padding:8px 10px;font-size:13px}.field textarea{min-height:230px}.lab{padding:10px 16px}.lab summary{display:block}.lab summary span{display:block}.form-actions{flex-wrap:wrap}.form-actions .btn{min-width:100px}}
@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>

<body>
<aside class="lab" aria-label="Инструменты прототипа"><div class="lab-inner"><details id="lab-details"><summary><strong>ПРОТОТИП · Админка</strong><span>Варианты и сценарии · данные только в памяти</span></summary><div class="lab-controls"><label>Состояние списка <select id="scenario"><option value="normal">Обычный список</option><option value="empty">Пустой список</option><option value="loading">Загрузка</option><option value="error">Ошибка загрузки</option></select></label><label><input type="checkbox" id="fail-next"> Ошибка следующего изменения</label><button id="reset">Сбросить пример</button><button id="go-more">Начать из «Еще»</button></div><p id="variant-description" class="lab-note"></p><details><summary>Текущее состояние прототипа</summary><pre id="state"></pre></details></details></div></aside>
<main id="app"></main>
<nav class="switcher" aria-label="Варианты прототипа"><button id="prev" aria-label="Предыдущий вариант">←</button><div class="switcher-label" id="variant-label"></div><button id="next" aria-label="Следующий вариант">→</button></nav>
<dialog id="confirm-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-text"><h2 id="dialog-title"></h2><p id="dialog-text"></p><div class="form-actions"><button class="btn" id="dialog-cancel">Отмена</button><button class="btn danger-fill" id="dialog-confirm">Удалить</button></div></dialog>
<script>
const SEED=[
 {id:'reading-by-lines',title:'Как читать шлоку по строкам',text:'Читайте каждую строку как отдельную смысловую фразу. Сначала произнесите её медленно, затем соедините со следующей строкой и повторите весь фрагмент без паузы.'},
 {id:'learning-through-meaning',title:'Как учить через смысл слов',text:'Разберите ключевые слова и свяжите их с общим смыслом строки.\n\nВспоминайте не только звучание, но и последовательность образов или действий, которую передаёт текст.'},
 {id:'when-recall-stalls',title:'Если шлока не вспоминается',text:'Не пытайтесь угадать весь текст сразу. Вспомните первое слово или смысл строки, прочитайте подсказку и затем повторите шлоку целиком ещё раз.'}
];
const variants={A:{name:'Отдельные страницы',description:'A: главная админки → раздел → отдельная форма. «Обучение» сразу показывает советы. Самый короткий путь без постоянного меню.'},B:{name:'Постоянное меню',description:'B: главная с разделами, затем постоянные вкладки. Между каталогом и обучением можно перейти с любой страницы, включая редактор.'},C:{name:'Список и редактор',description:'C: меню разделов слева, список и редактор рядом на широком экране. На телефоне список и форма открываются последовательно.'}};
const url=new URL(location.href);let variant=variants[url.searchParams.get('variant')]?url.searchParams.get('variant'):'A';
let tips=structuredClone(SEED),scenario='normal',failNext=false,notice='',error='',draft=null,seq=0,restoring=false,confirmAction=null;
let route=parseRoute(),historyIndex=0;
const app=document.querySelector('#app'),dialog=document.querySelector('#confirm-dialog');
function parseRoute(){const [screen,id]=location.hash.slice(1).split('/');return {screen:['more','admin','catalog','learning','edit','new'].includes(screen)?screen:'admin',id:id||null};}
function routeURL(r){const u=new URL(location.href);u.searchParams.set('variant',variant);u.hash=r.screen+(r.id?'/'+r.id:'');return u;}
history.replaceState({route,index:0},'',routeURL(route));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const editing=()=>route.screen==='edit'||route.screen==='new';
const dirty=()=>draft&&(draft.title!==draft.originalTitle||draft.text!==draft.originalText);
function button(label,action,extra='',cls='btn'){return `<button class="${cls}" data-action="${action}" ${extra}>${label}</button>`;}
function nav(label,screen,cls='btn quiet',extra=''){return button(label,'nav',`data-screen="${screen}" ${extra}`,cls);}
function confirmBox(title,text,label,action){document.querySelector('#dialog-title').textContent=title;document.querySelector('#dialog-text').textContent=text;document.querySelector('#dialog-confirm').textContent=label;confirmAction=action;dialog.showModal();document.querySelector('#dialog-cancel').focus();}
function guard(action){if(dirty())confirmBox('Выйти без сохранения?','Изменения в этом совете будут потеряны.','Выйти',()=>{draft=null;action();});else action();}
function go(screen,id=null,{replace=false}={}){guard(()=>{draft=null;notice='';error='';route={screen,id};if(!replace)historyIndex++;history[replace?'replaceState':'pushState']({route,index:historyIndex},'',routeURL(route));render();window.scrollTo(0,0);document.querySelector('h1')?.focus();});}
window.addEventListener('popstate',e=>{const target=e.state;if(!target)return;if(restoring){restoring=false;return;}if(dirty()){const delta=historyIndex-target.index;restoring=true;history.go(delta);confirmBox('Выйти без сохранения?','Изменения в этом совете будут потеряны.','Выйти',()=>{draft=null;history.go(-delta);});return;}draft=null;route=target.route;historyIndex=target.index;notice='';error='';render();});
window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue='';}});
function ensureDraft(){if(!editing())return;if(draft)return;const tip=route.screen==='edit'?tips.find(t=>t.id===route.id):null;if(route.screen==='edit'&&!tip){route={screen:'learning',id:null};history.replaceState({route,index:historyIndex},'',routeURL(route));notice='Этот совет больше не доступен.';return;}draft={id:tip?.id||null,title:tip?.title||'',text:tip?.text||'',originalTitle:tip?.title||'',originalText:tip?.text||''};}
function header(title,back='admin',eyebrow=''){return `<header class="page-header">${nav('←',back,'btn quiet icon','aria-label="Назад"')}<div class="grow">${eyebrow?`<div class="eyebrow">${eyebrow}</div>`:''}<h1 tabindex="-1">${title}</h1></div>${route.screen!=='more'?nav('В приложение','more','btn quiet small'):''}</header>`;}
function menu(){return `<nav class="admin-tabs" aria-label="Разделы админки">${nav('Разделы','admin')}${nav('Каталог шлок','catalog',`btn quiet ${route.screen==='catalog'?'active':''}`)}${nav('Обучение','learning',`btn quiet ${['learning','edit','new'].includes(route.screen)?'active':''}`)}</nav>`;}
function home(){return `${header('Админка','more')}<div class="home-intro"><p class="muted">Выберите раздел для управления содержимым.</p></div><div class="home-grid">${[['Каталог шлок','Шлоки и их источники','catalog','▤'],['Обучение','Советы для заучивания','learning','◇']].map(([t,d,s,i])=>`<button class="section-link" data-action="nav" data-screen="${s}"><span class="section-icon" aria-hidden="true">${i}</span><span class="grow"><h2>${t}</h2><p class="muted">${d}</p></span><span class="chevron" aria-hidden="true">›</span></button>`).join('')}</div>`;}
function more(){return `<header class="page-header"><h1 tabindex="-1">Еще</h1></header><div class="stack"><section class="card row between"><span><strong>Интенсивное повторение</strong><p class="muted small">Больше шлок на каждый день</p></span><input type="checkbox" aria-label="Интенсивное повторение"></section><button class="section-link" data-action="nav" data-screen="admin"><span class="section-icon" aria-hidden="true">◇</span><span class="grow"><h2>Админка</h2><p class="muted">Управление содержимым</p></span><span class="chevron" aria-hidden="true">›</span></button><p class="small muted">Вход в админку доступен администраторам.</p></div><div class="app-bottom" aria-label="Контекст приложения"><span>Главная</span><span>Библиотека</span><span>Обучение</span><b>Еще</b></div>`;}
function catalog(){return `<div class="stack"><p class="muted">Пополняйте и исправляйте общую библиотеку шлок.</p><div class="row">${button('＋ Новая шлока','catalog-stub')}${button('＋ Новый источник','catalog-stub')}</div><h2>Список шлок</h2>${[['Бхагавад-гита','18 глав',['2.47 Карманй эвадхикарас те','4.7 Йада йада хи дхармасйа']],['Иша Упанишада','18 шлок',['Мантра 1 Ишавасйам идам сарвам']]].map(([title,meta,items])=>`<section class="stack"><div class="card row between"><div><h3 class="catalog-source">${title}</h3><p class="small muted">${meta}</p></div>${button('Изменить','catalog-stub','','btn quiet')}</div><div class="catalog-items">${items.map(t=>`<div class="catalog-item row between"><span class="catalog-source">${t}</span>${button('✎','catalog-stub',`aria-label="Редактировать ${t}"`,'btn quiet icon')}</div>`).join('')}</div></section>`).join('')}</div>`;}
function orderButtons(t,i){return `<div class="order">${button('↑','move',`data-id="${t.id}" data-delta="-1" aria-label="Выше: ${esc(t.title)}" ${i===0?'disabled':''}`,'btn quiet icon')}${button('↓','move',`data-id="${t.id}" data-delta="1" aria-label="Ниже: ${esc(t.title)}" ${i===tips.length-1?'disabled':''}`,'btn quiet icon')}</div>`;}
function list(){if(scenario==='loading')return `<div class="card empty" role="status"><span class="spinner" aria-hidden="true"></span><p>Загружаем советы…</p></div>`;if(scenario==='error')return `<div class="card empty"><h3>Не удалось загрузить советы</h3><p class="muted">Попробуйте ещё раз.</p>${button('Повторить','retry')}</div>`;if(tips.length===0)return `<div class="card empty"><h3>Советов пока нет</h3><p class="muted">Добавьте первый совет для заучивания.</p>${button('Добавить совет','new','','btn primary')}</div>`;return `<div class="tip-list">${tips.map((t,i)=>`<article class="card tip-row-wrap ${route.id===t.id?'selected':''}"><div class="tip-row"><span class="ordinal">${i+1}</span><button class="tip-open" data-action="edit" data-id="${t.id}"><strong>${esc(t.title)}</strong><span class="excerpt">${esc(t.text)}</span></button>${variant==='C'?orderButtons(t,i):''}</div><div class="tip-footer">${orderButtons(t,i)}${button('Удалить','delete',`data-id="${t.id}"`,'btn quiet danger small')}</div></article>`).join('')}</div>`;}
function editor(){return `<form id="tip-form" class="editor" novalidate><div><h2>${draft.id?'Редактирование совета':'Новый совет'}</h2><p class="form-help">После сохранения совет сразу появится у пользователей.</p></div><div id="form-error" role="alert"></div><div class="field"><label for="tip-title">Заголовок</label><input id="tip-title" name="title" maxlength="120" required value="${esc(draft.title)}" aria-describedby="title-count"><div class="field-meta"><span>Обязательное поле</span><span id="title-count">${draft.title.length} / 120</span></div></div><div class="field"><label for="tip-text">Текст совета</label><textarea id="tip-text" name="text" maxlength="2000" required aria-describedby="text-count">${esc(draft.text)}</textarea><div class="field-meta"><span>Можно разделять текст на абзацы</span><span id="text-count">${draft.text.length} / 2000</span></div></div><div class="form-actions"><button class="btn primary" type="submit">Сохранить</button><button class="btn" type="button" data-action="nav" data-screen="learning">Отмена</button></div>${draft.id?`<div>${button('Удалить совет','delete',`type="button" data-id="${draft.id}"`,'btn quiet danger')}</div>`:''}</form>`;}
function learningContent(){return `<div class="toolbar"><div><h2>Советы</h2><p class="small muted">${scenario==='normal'?`${tips.length} в списке · `:''}Порядок задаётся стрелками</p></div>${tips.length||scenario!=='normal'?button('＋ Добавить','new','','btn primary'):''}</div>${list()}`;}
function feedback(){return `${notice?`<div class="notice" role="status">${esc(notice)}</div>`:''}${error?`<div class="notice error" role="alert">${esc(error)}</div>`:''}`;}
function render(){ensureDraft();document.querySelector('#variant-label').innerHTML=`${variant} · ${variants[variant].name}<small>← → переключают варианты</small>`;document.querySelector('#variant-description').textContent=variants[variant].description;document.querySelector('#scenario').value=scenario;document.querySelector('#fail-next').checked=failNext;
if(route.screen==='more'){app.className='page';app.innerHTML=more();}
else if(route.screen==='admin'){app.className=`page ${variant==='C'?'variant-c-home':''}`;app.innerHTML=home();}
else if(variant==='C'){app.className='workspace';app.innerHTML=`${header('Админка','admin')}<div class="workspace-grid"><nav class="side-nav" aria-label="Разделы админки">${nav('Все разделы','admin','btn quiet side-home')}${nav('Каталог шлок','catalog',`btn ${route.screen==='catalog'?'active':'quiet'}`)}${nav('Обучение','learning',`btn ${route.screen!=='catalog'?'active':'quiet'}`)}</nav><section>${feedback()}${route.screen==='catalog'?`<h1 tabindex="-1" style="margin-bottom:20px">Каталог шлок</h1>${catalog()}`:`<div class="toolbar"><div><div class="eyebrow">Обучение</div><h2>Советы</h2></div>${button('＋ Добавить','new','','btn primary')}</div><div class="split ${editing()?'editing':''}"><section class="list-pane" aria-label="Список советов">${list()}</section><section class="editor-pane">${editing()?`${nav('← К списку','learning','btn quiet mobile-back')}<div class="card">${editor()}</div>`:'<div class="card placeholder"><h3>Выберите совет</h3><p class="muted">Его текст откроется здесь.</p></div>'}</section></div>`}</section></div>`;}
else{app.className=`page ${variant==='B'?'b-layout':''}`;const title=route.screen==='catalog'?'Каталог шлок':editing()?'Совет':'Обучение';app.innerHTML=`${header(title,editing()?'learning':'admin',editing()?'Обучение · Советы':'Админка')}${variant==='B'?menu():''}${feedback()}${route.screen==='catalog'?catalog():editing()?`<div class="card">${editor()}</div>`:learningContent()}`;}
app.querySelector('#tip-form')?.addEventListener('submit',save);app.querySelectorAll('#tip-title,#tip-text').forEach(el=>el.addEventListener('input',()=>{draft.title=document.querySelector('#tip-title').value;draft.text=document.querySelector('#tip-text').value;document.querySelector('#title-count').textContent=`${draft.title.length} / 120`;document.querySelector('#text-count').textContent=`${draft.text.length} / 2000`;state();}));state();}
function state(){document.querySelector('#state').textContent=JSON.stringify({variant,screen:route.screen,selectedTip:route.id,scenario,unsavedChanges:!!dirty(),nextMutationFails:failNext,order:tips.map(t=>t.id),draft:draft?{title:draft.title,text:draft.text}:null},null,2);}
function mutationFails(message){if(!failNext)return false;failNext=false;notice='';document.querySelector('#fail-next').checked=false;error=message;state();return true;}
function save(e){e.preventDefault();const title=draft.title.trim(),text=draft.text.trim();const formError=document.querySelector('#form-error');if(!title||!text||title.length>120||text.length>2000){formError.className='notice error';formError.textContent='Заполните заголовок и текст в пределах указанных лимитов.';document.querySelector(!title?'#tip-title':'#tip-text').focus();return;}if(mutationFails('Не удалось сохранить совет. Изменения остались в форме. Попробуйте ещё раз.')){formError.className='notice error';formError.textContent=error;error='';return;}const tip={id:draft.id||`new-tip-${++seq}`,title,text};const i=tips.findIndex(t=>t.id===tip.id);if(i<0)tips.push(tip);else tips[i]=tip;draft=null;error='';notice='Совет сохранён и опубликован.';scenario='normal';route={screen:'learning',id:null};history.replaceState({route,index:historyIndex},'',routeURL(route));render();}
function remove(id){const t=tips.find(t=>t.id===id);if(!t)return;confirmBox('Удалить совет?',`«${t.title}» исчезнет из списка советов. Восстановить его будет нельзя.`,'Удалить',()=>{if(mutationFails('Не удалось удалить совет. Он остался в списке. Попробуйте ещё раз.')){render();return;}tips=tips.filter(t=>t.id!==id);if(draft?.id===id){draft=null;route={screen:'learning',id:null};history.replaceState({route,index:historyIndex},'',routeURL(route));}error='';notice='Совет удалён.';render();});}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='nav')go(b.dataset.screen);if(a==='new')go('new');if(a==='edit')go('edit',b.dataset.id);if(a==='delete')remove(b.dataset.id);if(a==='retry'){scenario='normal';error='';render();}if(a==='move'){const id=b.dataset.id,delta=Number(b.dataset.delta);guard(()=>{if(mutationFails('Не удалось изменить порядок. Прежний порядок сохранён.')){render();return;}const i=tips.findIndex(t=>t.id===id),j=i+delta;if(j<0||j>=tips.length)return;[tips[i],tips[j]]=[tips[j],tips[i]];notice='Порядок советов сохранён.';error='';render();});}if(a==='catalog-stub'){notice='В прототипе показано место существующих форм каталога. Их возможности сохраняются.';render();}});
document.querySelector('#dialog-cancel').onclick=()=>{dialog.close();confirmAction=null;};document.querySelector('#dialog-confirm').onclick=()=>{dialog.close();const action=confirmAction;confirmAction=null;action?.();};dialog.addEventListener('cancel',()=>{confirmAction=null;});
function switchVariant(delta){guard(()=>{const keys=Object.keys(variants);variant=keys[(keys.indexOf(variant)+delta+keys.length)%keys.length];history.replaceState({route,index:historyIndex},'',routeURL(route));render();});}
document.querySelector('#prev').onclick=()=>switchVariant(-1);document.querySelector('#next').onclick=()=>switchVariant(1);document.addEventListener('keydown',e=>{if(dialog.open||e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();switchVariant(e.key==='ArrowLeft'?-1:1);}});
document.querySelector('#scenario').onchange=e=>{const target=e.target.value;guard(()=>{scenario=target;tips=target==='empty'?[]:structuredClone(SEED);draft=null;route={screen:'learning',id:null};notice='';error='';history.replaceState({route,index:historyIndex},'',routeURL(route));render();});};document.querySelector('#fail-next').onchange=e=>{failNext=e.target.checked;state();};document.querySelector('#reset').onclick=()=>guard(()=>{tips=structuredClone(SEED);scenario='normal';failNext=false;draft=null;notice='';error='';route={screen:'admin',id:null};historyIndex++;history.pushState({route,index:historyIndex},'',routeURL(route));render();});document.querySelector('#go-more').onclick=()=>go('more');
render();
</script>
</body>
</html>
