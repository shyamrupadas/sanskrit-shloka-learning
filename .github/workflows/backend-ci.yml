name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/api-contract/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "turbo.json"
      - "Dockerfile"
      - ".dockerignore"
      - "docker/api-entrypoint.sh"
      - "railway.json"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify backend release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node from package metadata
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Enable pnpm from package metadata
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API workspace dependencies
        run: pnpm --filter "@sanskrit-shloka-learning/api^..." build

      - name: Typecheck API and workspace dependencies
        run: pnpm --filter @sanskrit-shloka-learning/api... typecheck

      - name: Test API and workspace dependencies
        run: pnpm --filter @sanskrit-shloka-learning/api... test

      - name: Build API and workspace dependencies
        run: pnpm --filter @sanskrit-shloka-learning/api... build

      - name: Build final production image
        run: docker build --target production .

  promote:
    name: Promote verified backend commit
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out verified commit with full history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fast-forward Amvera release branch
        # Never force push: divergent history or a newer release must fail
        # instead of rolling back. Checkout uses the job's default GITHUB_TOKEN.
        run: git push origin "${GITHUB_SHA}:refs/heads/amvera-api"
