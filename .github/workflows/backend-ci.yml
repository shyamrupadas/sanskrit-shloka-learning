name: Backend CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cover planning (including no-op decisions), verification and promotion.
  # Each queued run checks current main, including manual runs and reruns.
  group: backend-ci-refs/heads/main
  cancel-in-progress: false

jobs:
  prepare:
    name: Plan backend release
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      release_sha: ${{ steps.plan.outputs.release_sha }}
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - name: Check out current main after acquiring the release queue
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node from package metadata
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Test backend release behavior
        run: node --test .github/scripts/backend-release.test.mjs

      - name: Compare backend inputs with the last release
        id: plan
        run: node .github/scripts/backend-release.mjs plan

  verify:
    name: Verify backend release
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node from package metadata
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Enable pnpm from package metadata
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API workspace dependencies
        run: pnpm --filter "@sanskrit-shloka-learning/api^..." build

      - name: Typecheck API and workspace dependencies
        run: pnpm --filter @sanskrit-shloka-learning/api... typecheck

      - name: Test API and workspace dependencies
        run: pnpm --filter @sanskrit-shloka-learning/api... test

      - name: Build API and workspace dependencies
        run: pnpm --filter @sanskrit-shloka-learning/api... build

      - name: Build final production image
        run: docker build --target production --tag shlokahub-api:ci .

      - name: Verify non-root API startup on the container port
        run: |
          # Exercise the compiled API with Linux privileged-port restrictions.
          # Skip startup migrations: this smoke test has no database or network.
          docker run --rm --interactive --network none --cap-drop ALL \
            --security-opt no-new-privileges \
            --sysctl net.ipv4.ip_unprivileged_port_start=1024 \
            --env FRONTEND_ORIGIN=https://app.example.invalid \
            --env DATABASE_URL=postgresql://fixture:fixture@db.invalid/app \
            --env DATABASE_DIRECT_URL=postgresql://fixture:fixture@direct.invalid/app \
            --entrypoint node shlokahub-api:ci --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { bootstrap } from "./dist/main.js";

          const timeout = setTimeout(() => {
            console.error("Container startup smoke test timed out");
            process.exit(1);
          }, 15_000);
          try {
            assert.notEqual(process.getuid(), 0);
            assert.equal(process.env.PORT, "8080");
            await bootstrap();
            const response = await fetch("http://127.0.0.1:8080/health/live");
            assert.equal(response.status, 200);
            assert.deepEqual(await response.json(), { status: "ok" });
            console.log("Non-root container startup: PASS");
            process.exit(0);
          } catch (error) {
            console.error(error);
            process.exit(1);
          } finally {
            clearTimeout(timeout);
          }
          NODE

  promote:
    name: Promote verified backend commit
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out verified commit with full history
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Set up Node from package metadata
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Publish verified tree as a fast-forward release commit
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          EXPECTED_RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: node .github/scripts/backend-release.mjs promote
