packages:
  - "apps/*"
  - "packages/*"
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build
overrides:
  # NestJS 12.0.1 pins multer 2.2.0, which has known DoS vulnerabilities.
  '@nestjs/platform-express@12.0.1>multer': '2.3.0'
allowBuilds:
  '@nestjs/core': true
  esbuild: true
  msw: false
  unrs-resolver: false
